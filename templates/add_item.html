<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Item</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    /* small page-specific tweaks */
    .form-wrap{max-width:720px;margin:36px auto;padding:20px}
    form .row{display:flex;gap:12px;flex-wrap:wrap}
    label{display:block;margin-bottom:6px;font-weight:700;color:var(--accent)}
    input[type="text"], input[type="number"], textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e6e6}
  </style>
</head>
<body>
  <div class="form-wrap container">
    <div class="card">
      <div class="card-header">
        <h2>Add new item</h2>
      </div>
      <div class="card-body">
        <form action="/add_item" method="POST" enctype="multipart/form-data">
          <div class="row">
            <div style="flex:1">
              <label for="item_id">Item ID</label>
              <input type="text" id="item_id" name="item_id" placeholder="Unique item id" required>
            </div>
            <div style="flex:2">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Item name" required>
            </div>
          </div>

          <div style="margin-top:12px">
            <label for="info">Information / Description</label>
            <textarea id="info" name="info" rows="5" placeholder="Describe the item"></textarea>
          </div>

          <div style="margin-top:12px" class="row">
            <div style="flex:1">
              <label for="stocks">Number of stocks</label>
              <input type="number" id="stocks" name="stocks" min="0" value="1">
            </div>
            <div style="flex:1">
              <label for="image">Picture</label>
              <input type="file" id="image" name="image" accept="image/*">
            </div>
          </div>

          <div style="margin-top:18px;display:flex;gap:12px;justify-content:flex-end">
            <a class="btn-ghost" href="/inventorycheck">Cancel</a>
            <button class="btn-primary" type="submit">Add Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
