<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Availability</title>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <form action="/bookingaviability" method="POST">
  <!-- Header -->
  <header>
    <a> <button class="button" type="submit" name="submit" onclick="" value="HOME"><img src="logo.png" alt="Logo"></button></a>
    <a> <button class="button" type="submit" name="submit" onclick="" value="LOGOUT">Log out</button></a>
  </header>

  <!-- Hauptinhalt -->
  <main>
    <h1>Booking Availability</h1>

    <form class="booking-form" action="/bookingaviability" method="POST">
      <!-- Startzeit -->
      <div class="booking-row">
        <label for="start-date">Startdatum:</label>
        <input type="date" id="start-date" name="start-date">
        <label for="start-time">Startzeit:</label>
        <select id="start-time" name="start-time">
          <option value="">-- Uhrzeit --</option>
        </select>
      </div>

      <!-- Endzeit -->
      <div class="booking-row">
        <label for="end-date">Enddatum:</label>
        <input type="date" id="end-date" name="end-date">
        <label for="end-time">Endzeit:</label>
        <select id="end-time" name="end-time">
          <option value="">-- Uhrzeit --</option>
        </select>
      </div>

      <button button class="button" type="submit" name="submit" onclick="" value="SAVE">Save Availability</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
        <p><a href="impressum.html">Impressum</a></p>
        <img src="logo.png" alt="Logo">
  </footer>

  <script>
    // Fülle Uhrzeiten von 9:00 bis 18:00 Uhr
    const startTimeSelect = document.getElementById('start-time');
    const endTimeSelect = document.getElementById('end-time');

    for(let hour = 9; hour <= 18; hour++) {
      let hourStr = hour.toString().padStart(2, '0') + ":00";
      let option1 = document.createElement('option');
      option1.value = hourStr;
      option1.textContent = hourStr;
      startTimeSelect.appendChild(option1);

      let option2 = document.createElement('option');
      option2.value = hourStr;
      option2.textContent = hourStr;
      endTimeSelect.appendChild(option2);
    }
  </script>
    </form>
</body>
