<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item Detail</title>
  <link rel="stylesheet" href="/static/css/item_detail.css">
</head>
<body>
  <!-- Use a form so the BACK / BOOK / LOGOUT actions map to existing POST handlers -->
  <form action="/item_detail/{{ item_id }}" method="POST" class="page-form">
    <header class="site-header">
      <a class="brand" href="/">Lagertool</a>
      <div class="header-right">
        {% if user01.user_info and user01.user_info[0] != -1 %}
          <button class="logout" type="submit" name="submit" onclick="" value="LOGOUT">Log out</button>
        {% endif %}
      </div>
    </header>

    <main class="container">
      <div class="card">
        <div class="card-header">
          <h1 class="item-name">{{ item_name }}</h1>
          <span class="item-category">{{ catagory }}</span>
        </div>

        <div class="card-body">
          <section class="details">
            <h2>About this item</h2>
            <p class="description">{{ discription }}</p>

            <ul class="meta">
              <li><strong>Item ID:</strong> {{ item_id }}</li>
              <li><strong>Available:</strong> {{ available }}</li>
              <li><strong>Total:</strong> {{ total }}</li>
            </ul>
          </section>
        </div>

        <div class="card-footer">
          <div class="buttons">
            <button class="btn btn-ghost" type="submit" name="submit" onclick="" value="BACK">Back</button>
            <button class="btn btn-primary" type="submit" name="submit" onclick="" value="BOOK">Book</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>© Lagertool</p>
    </footer>
  </form>
</body>
</html>
